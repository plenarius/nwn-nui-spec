# The keys the client reads from nui_skin.tml, in the order Nui__ReloadSkin
# reads them, with their value type, the default when a key is missing and,
# for nine-slice images, the slice margins the client passes.
# CC0 1.0. Build 89.8193.37-17, nwmain-linux
# (sha256 6d19c39bc646af5ddbc333ff31797a4acd9019506bcb45ef1b93b1bd5925e700).
# Nui__ReloadSkin is at 0x1205460 (objdump; Ghidra adds 0x100000).
# Evidence: T43, T44, T45 (engine/behaviour.md). Key names and numbers only:
# no content of the game's own nui_skin.tml is reproduced.
#
# type:
#   image9   a texture resref drawn nine-sliced (nk_styleimg9, 0x1205120)
#            with the fixed `margins` [left, top, right, bottom] in texture
#            pixels; a "#colour" here is read as a resref and fails
#   imgcol   "#RRGGBBAA" for a flat colour, else a texture stretched over
#            the widget (nk_styleimg, 0x1204e90)
#   colour   "#RRGGBBAA"
#   int      a whole number
# default: what the client uses when the key is missing.
# region:  only this rect [x, y, w, h] of the texture is used (thumbs),
#          `tile` [along x, along y] says which axis it repeats along.
#          Which tiling flag is which axis was read from a screenshot (T44).
# tab.background's margins are (5, 3, 3, 3) in the call; which side has the
# 5 is not known. They are listed here with 5 on the left.
# read: false marks keys the client never reads (T45), listed so a checker
#       can say so. scrollh.border_color is not asked for at all
#       (scrollv.border_color is).
# The [[fonts]] array (T25-T27) is read after text.color; its keys are in
# defaults.yaml.

